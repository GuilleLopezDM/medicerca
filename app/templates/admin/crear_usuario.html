{% extends "base.html" %}
{% block titulo %}Crear usuario — Admin MediCerca{% endblock %}

{% block contenido %}
<div class="max-w-2xl mx-auto px-4 md:px-8 py-10">

  <!-- Breadcrumb -->
  <nav class="flex items-center gap-2 text-xs text-gray-400 font-medium mb-8">
    <a href="{{ url_for('admin.dashboard') }}" class="hover:text-[#3B82F6] transition-colors">Admin</a>
    <span class="text-gray-300">›</span>
    <a href="{{ url_for('admin.listar_usuarios') }}" class="hover:text-[#3B82F6] transition-colors">Usuarios</a>
    <span class="text-gray-300">›</span>
    <span class="text-gray-600">Nuevo usuario</span>
  </nav>

  <div class="bg-white rounded-2xl border border-gray-100/80 shadow-sm overflow-hidden">
    <div class="h-0.5 bg-gradient-to-r from-[#3B82F6] to-[#60A5FA]"></div>

    <div class="p-6 md:p-8">
      <div class="mb-8 pb-6 border-b border-gray-100">
        <h1 class="text-xl font-bold tracking-tight text-[#1F2937]">Crear nuevo usuario</h1>
        <p class="text-sm text-gray-500 mt-1">El usuario será creado con el correo ya verificado.</p>
      </div>

      <form method="POST" action="{{ url_for('admin.procesar_crear_usuario') }}" class="space-y-5">

        <div class="grid md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">
              Nombre <span class="text-red-400">*</span>
            </label>
            <input type="text" name="nombre" required placeholder="Juan Pérez"
                   class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50/60 outline-none
                          focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                          hover:border-gray-300 transition-all duration-200">
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">
              Correo <span class="text-red-400">*</span>
            </label>
            <input type="email" name="correo" required placeholder="usuario@ejemplo.com"
                   class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50/60 outline-none
                          focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                          hover:border-gray-300 transition-all duration-200">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">Rol</label>
          <select name="rol"
                  class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50/60 outline-none
                         focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                         hover:border-gray-300 transition-all duration-200">
            <option value="paciente">Paciente</option>
            <option value="medico">Médico</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">
            Contraseña <span class="text-red-400">*</span>
          </label>
          <input type="password" name="contrasena" required placeholder="Mínimo 8 caracteres"
                 class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50/60 outline-none
                        focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                        hover:border-gray-300 transition-all duration-200">
        </div>

        <div class="flex items-center gap-3 pt-2 border-t border-gray-100">
          <button type="submit"
                  class="inline-flex items-center gap-2 bg-[#3B82F6] text-white font-semibold text-sm px-6 py-3
                         rounded-xl hover:bg-[#60A5FA] hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
            Crear usuario
          </button>
          <a href="{{ url_for('admin.listar_usuarios') }}"
             class="px-5 py-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-500
                    hover:border-gray-300 hover:bg-gray-50 transition-all duration-200">
            Cancelar
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block titulo %}Registrarse — MediCerca{% endblock %}

{% block contenido %}

<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-16 auth-shell relative overflow-hidden">

  <div class="absolute top-0 inset-x-0 h-80 bg-gradient-to-b from-[#3B82F6]/8 to-transparent pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 animate-slide-up">

    <!-- Logo -->
    <div class="text-center mb-10">
      <a href="{{ url_for('principal.inicio') }}" class="inline-flex items-center gap-2.5 text-[#1F2937] dark:text-slate-100 hover:opacity-70 transition-opacity duration-200">
        <span class="text-2xl">🩺</span>
        <span class="text-xl font-semibold tracking-tight">MediCerca</span>
      </a>
    </div>

    <!-- Card -->
    <div class="auth-card rounded-[1.75rem] p-8 md:p-9">

      <div class="mb-8">
        <h1 class="text-xl font-bold tracking-tight text-[#1F2937] dark:text-slate-100 mb-1">Crear cuenta</h1>
        <p class="text-sm text-gray-500">Únite a la red de médicos verificados</p>
      </div>

      <form method="POST" action="{{ url_for('autenticacion.registro') }}" class="space-y-4">

        <div class="space-y-1.5">
          <label for="nombre" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required autocomplete="name"
                 placeholder="Tu nombre completo"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-[#1F2937] placeholder-gray-400
                        bg-gray-50/60 outline-none
                        focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                        hover:border-gray-300 transition-all duration-200">
        </div>

        <div class="space-y-1.5">
          <label for="correo" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">Correo electrónico</label>
          <input type="email" id="correo" name="correo" required autocomplete="email"
                 placeholder="tu@correo.com"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-[#1F2937] placeholder-gray-400
                        bg-gray-50/60 outline-none
                        focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                        hover:border-gray-300 transition-all duration-200">
        </div>

        <div class="space-y-1.5">
          <label for="contrasena" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required autocomplete="new-password"
                 placeholder="••••••••"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-[#1F2937] placeholder-gray-400
                        bg-gray-50/60 outline-none
                        focus:ring-2 focus:ring-[#3B82F6] focus:border-transparent focus:bg-white
                        hover:border-gray-300 transition-all duration-200">
        </div>

        <!-- Rol selector — pill style -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wide">Tipo de cuenta</label>
          <div class="grid grid-cols-2 gap-3">

            <label class="relative cursor-pointer">
              <input type="radio" name="rol" value="paciente" required class="sr-only peer" checked>
              <div class="flex flex-col items-center gap-1.5 px-3 py-3.5 rounded-xl border-2 border-gray-200
                          peer-checked:border-[#3B82F6] peer-checked:bg-[#3B82F6]/8
                          hover:border-gray-300 transition-all duration-200 text-center">
                <span class="text-xl">🧑</span>
                <span class="text-sm font-semibold text-[#1F2937]">Paciente</span>
                <span class="text-xs text-gray-400">Busco médicos</span>
              </div>
            </label>

            <label class="relative cursor-pointer">
              <input type="radio" name="rol" value="medico" required class="sr-only peer">
              <div class="flex flex-col items-center gap-1.5 px-3 py-3.5 rounded-xl border-2 border-gray-200
                          peer-checked:border-[#3B82F6] peer-checked:bg-[#3B82F6]/8
                          hover:border-gray-300 transition-all duration-200 text-center">
                <span class="text-xl">👨‍⚕️</span>
                <span class="text-sm font-semibold text-[#1F2937]">Médico</span>
                <span class="text-xs text-gray-400">Quiero registrarme</span>
              </div>
            </label>

          </div>
        </div>

        <div class="pt-2">
          <button type="submit"
                  class="w-full bg-[#3B82F6] text-white font-semibold text-sm py-3 px-4 rounded-xl
                         hover:bg-[#60A5FA] hover:scale-[1.02] hover:shadow-[0_4px_16px_rgba(59,130,246,0.24)]
                         active:scale-[0.98] transition-all duration-200 ease-out">
            Crear cuenta
          </button>
        </div>

      </form>

      <div class="mt-7 pt-6 border-t border-gray-100 text-center">
        <p class="text-sm text-gray-500">
          ¿Ya tenés cuenta?
          <a href="{{ url_for('autenticacion.iniciar_sesion') }}"
             class="font-semibold text-[#3B82F6] hover:underline ml-1 transition-colors duration-150">
            Iniciá sesión
          </a>
        </p>
      </div>

    </div>

    <p class="text-center text-xs text-gray-400 mt-5 flex items-center justify-center gap-1.5">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      Conexión segura · Datos protegidos
    </p>

  </div>
</div>

{% endblock %}

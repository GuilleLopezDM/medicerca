{% extends "base.html" %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}

<div class="min-h-screen flex items-center justify-center bg-[#F2F2F2] px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-200 p-8">

        <h1 class="text-3xl font-bold text-center text-[#252529] mb-2">
            Iniciar sesión
        </h1>

        <p class="text-gray-500 text-center mb-6">
            Accedé a tu cuenta de MediCerca
        </p>

        <form method="POST" action="{{ url_for('autenticacion.iniciar_sesion') }}" class="space-y-5">

            <!-- CORREO -->
            <div>
                <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    placeholder="correo@ejemplo.com"
                    class="w-full rounded-xl border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#8BF57A] focus:border-[#8BF57A]"
                >
            </div>

            <!-- CONTRASEÑA -->
            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700 mb-1">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                    placeholder="********"
                    class="w-full rounded-xl border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#8BF57A] focus:border-[#8BF57A]"
                >
            </div>

            <!-- RECORDARME -->
            <div class="flex items-center gap-2">
                <input
                    type="checkbox"
                    id="recordarme"
                    name="recordarme"
                    class="h-4 w-4 rounded border-gray-300 text-[#8BF57A] focus:ring-[#8BF57A]"
                >

                <label for="recordarme" class="text-sm text-gray-700">
                    Recordarme
                </label>
            </div>

            <!-- BOTÓN -->
            <button
                type="submit"
                class="w-full bg-[#8BF57A] hover:opacity-90 text-[#252529] font-semibold py-2.5 rounded-xl transition"
            >
                Iniciar Sesión
            </button>

        </form>

        <!-- LINK REGISTRO -->
        <p class="text-sm text-center text-gray-600 mt-6">
            ¿No tenés cuenta?
            <a
                href="{{ url_for('autenticacion.registro') }}"
                class="font-medium text-[#205ea6] hover:underline"
            >
                Registrarse
            </a>
        </p>

    </div>

</div>

{% endblock %}
